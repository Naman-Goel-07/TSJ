    <!--
      Two changes worth noting.

      Archivo now loads its width axis and the full weight range. The old URL
      requested wght@400..800 only, so `font-variation-settings: 'wdth' 112` in
      index.css has been doing nothing this whole time — the wordmark has been
      rendering at the default width and at 800 rather than 900.

      Martian Mono is new: it is the instrumentation voice for labels, buttons
      and status readings.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@400..800&display=swap"
      rel="stylesheet">

  </body>
